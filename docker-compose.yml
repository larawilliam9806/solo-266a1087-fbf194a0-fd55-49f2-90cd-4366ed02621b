services:
  airport-report:
    build: .
    image: airport-report:latest
    container_name: airport-report
    ports:
      - "8000:8000"
    environment:
      AIRPORT_DB_PATH: /data/airport.db
    volumes:
      - airport_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  airport_data:
